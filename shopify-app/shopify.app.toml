# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "afd273d42cc347f2f3caddd2a721f864"
application_url = "https://example.com"
embedded = true
name = "Ommetryx"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_app_proxy"

# Widget ↔ Backend: https://<shop>/apps/ommetryx/... → <app>/proxy/...
# Jede Anfrage trägt eine Shopify-Signatur, die App prüft sie (authenticate.public.appProxy).
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "ommetryx"

# Ist ein Produkt von Ommetryx vermessen? Gesetzt beim Speichern in /intern.
# Der App-Block im Theme liest es und zeigt den Button nur bei vermessenen Produkten.
[product.metafields.app.vermessen]
type = "boolean"
name = "Ommetryx: vermessen"
description = "Wird von Ommetryx gesetzt, wenn Kleidungsmaße für dieses Produkt vorliegen."

  [product.metafields.app.vermessen.access]
  admin = "merchant_read"
  storefront = "public_read"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Shopify-Pflicht für den App Store (Datenschutz)
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

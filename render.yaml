# Server bei Render (Frankfurt). Noch NICHT angelegt: siehe docs/start-checkliste.md.
# autoDeploy: false – nichts geht von selbst online, jeder Start ist eine bewusste Entscheidung.
# Geheimnisse (sync: false) trägt ihr beim Anlegen in Render ein, sie stehen nie im Code.
# Tarife vor dem Anlegen in Render prüfen, auch ob preDeployCommand im gewählten Tarif läuft.

databases:
  - name: ommetryx-db
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: ommetryx

services:
  - type: web
    name: ommetryx
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /gesund
    preDeployCommand: npm run server:vorbereiten
    envVars: &umgebung
      - key: NODE_ENV
        value: production
      - key: SCOPES
        value: write_products,write_app_proxy
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_IDENTITY
        sync: false
      - key: DATABASE_URL_BODY
        sync: false
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: ommetryx-db
          property: connectionString
      - key: INTERN_SCHLUESSEL
        sync: false
      - key: OX_SCHLUESSEL_IDENTITY
        sync: false
      - key: OX_SCHLUESSEL_BODY
        sync: false
      - key: OX_HASH_SCHLUESSEL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: OX_MAIL_ABSENDER
        sync: false

  # Täglicher Pflege-Lauf: 24-Monats-Löschung mit Erinnerung, Aufräumen
  - type: cron
    name: ommetryx-pflege
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run pflege
    autoDeploy: false
    schedule: "0 3 * * *"
    envVars: *umgebung
